name: Sync release notes

on:
  push:
    branches: [main]
    paths:
      - 'docs/releases/*.md'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update GitHub release body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="${{ github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^)"
          fi
          files="$(git diff --name-only "$base" "${{ github.sha }}" -- 'docs/releases/*.md' || true)"
          for file in $files; do
            [ -f "$file" ] || continue
            version="$(basename "$file" .md)"
            tag="v${version}"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --notes-file "$file"
              echo "Updated release notes for $tag"
            else
              echo "Release $tag not found; skipped"
            fi
          done
